# Long simulations, weekly and on demand (AGENTS.md section 6, "CI (GitHub Actions)"). Every matrix
# entry runs on its own runner: the system scenarios one each; run_core_machine.py (the libraries'
# machine16 on pocket_memory, then its fault); the libraries' tests (lib/retroMachines and its
# lib/retroICs) one test with its faults each, through scripts/simrun.py run --test. The failure
# artifacts leave out the simulation inputs (cartridge.hex is the ROM disk, whose public
# distribution is undecided; monitor.hex, bios.hex, font.hex) and the compiled *.vvp.
# Time limits: 2-3 times the remote host's measured times (a GitHub runner's Icarus is that much
# slower), at most GitHub's 360 min per job.
name: weekly

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  system:
    name: System scenario ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:          # remote minutes measured 2026-11-11 in the comments
          - { scenario: boot, timeout: 150 }              # 30
          - { scenario: powerup, timeout: 120 }           # 21
          - { scenario: nocart, timeout: 90 }             # 15
          - { scenario: reset, timeout: 240 }             # 60
          - { scenario: relock, timeout: 180 }            # 40
          - { scenario: system_watchdog, timeout: 150 }   # 31
          - { scenario: keytap, timeout: 210 }            # not measured yet (about 2.5 boots)
          - { scenario: k1, timeout: 340 }                # 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-iverilog
      - name: Fetch and check the assets
        run: python -B scripts/fetch_assets.py
      - name: ${{ matrix.scenario }}
        run: python -B fpga/sim/run_sim.py ${{ matrix.scenario }}
      - if: matrix.scenario == 'k1'
        name: K1 captures against the model
        run: python -B scripts/k1/check_frames.py build/sim/k1 --expect 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-${{ matrix.scenario }}
          path: |
            build/sim/${{ matrix.scenario }}/
            !build/sim/**/cartridge.hex
            !build/sim/**/monitor.hex
            !build/sim/**/font.hex
            !**/*.vvp
          retention-days: 7
          if-no-files-found: ignore

  core-machine-pocket:
    name: Core machine16 on pocket_memory
    runs-on: ubuntu-24.04
    timeout-minutes: 240    # machine16 40 min remote, then its fault
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-iverilog
      - name: machine16 on pocket_memory and the fault memory_dropped_after_rd
        run: python -B fpga/sim/run_core_machine.py
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-machine-pocket
          path: |
            build/sim/core_machine/
            !**/cartridge.hex
            !**/monitor.hex
            !**/bios.hex
            !**/font.hex
            !**/*.vvp
          retention-days: 7
          if-no-files-found: ignore

  library-test:
    name: Library test ${{ matrix.test }}
    runs-on: ubuntu-24.04
    # a unit TB with its faults: up to about 1.5 h remote; machine16 (40 min remote) with its faults
    # may take the GitHub job maximum (its faults run 4 at a time: --jobs 4, the runner's 4 CPUs)
    timeout-minutes: ${{ matrix.test == 'machine16' && 360 || 330 }}
    strategy:
      fail-fast: false
      matrix:
        include:          # one entry per test of the libraries' manifests (test_layout.py checks it)
          - { component: machines/rk86, test: clocks16 }
          - { component: intel/8255a, test: vv55 }
          - { component: intel/8257, test: vt57 }
          - { component: intel/8257, test: vt57_func }
          - { component: intel/8275, test: vg75 }
          - { component: intel/8275, test: vg75_dma }
          - { component: intel/8275, test: vg75_attr }
          - { component: machines/rk86, test: video16 }
          - { component: machines/rk86, test: machine16 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-iverilog
      - name: simrun ${{ matrix.component }} ${{ matrix.test }} with its faults
        run: python -B scripts/simrun.py run ${{ matrix.component }} --test ${{ matrix.test }} --tier full --negative --jobs 4 --out build/simrun
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: library-test-${{ matrix.test }}
          path: |
            build/simrun/
            !**/cartridge.hex
            !**/monitor.hex
            !**/bios.hex
            !**/font.hex
            !**/*.vvp
          retention-days: 7
          if-no-files-found: ignore
