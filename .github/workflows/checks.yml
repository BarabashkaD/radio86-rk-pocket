# Tests, package checks and short simulations (AGENTS.md section 6, "CI (GitHub Actions)"). No
# Quartus build: the package dry run uses a stand-in bitstream and its zip is not uploaded. The
# failure artifacts leave out the simulation inputs (cartridge.hex is the ROM disk, whose public
# distribution is undecided; monitor.hex, font.hex) and the compiled *.vvp.
name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  python:
    name: Python tests and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-iverilog
      - name: Repository rules
        run: python -B scripts/check_repo.py
      - name: Unit tests (no skips)
        run: pwsh -File scripts/ci/unit-tests.ps1
      - name: Fetch and check the assets
        run: python -B scripts/fetch_assets.py
      - name: Package dry run with a stand-in bitstream
        run: pwsh -File scripts/ci/package-dry-run.ps1

  sim-unit:
    name: Unit simulations and faults
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-iverilog
      - name: Fetch and check the assets
        run: python -B scripts/fetch_assets.py
      - name: Unit TBs, then each fault must fail with its own error
        run: python -B fpga/sim/run_sim.py --negative
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-unit
          path: |
            build/sim/
            !build/sim/**/cartridge.hex
            !build/sim/**/monitor.hex
            !build/sim/**/font.hex
            !**/*.vvp
          retention-days: 7
          if-no-files-found: ignore

  k1-panel:
    name: K1 panel scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-iverilog
      - name: Fetch and check the assets
        run: python -B scripts/fetch_assets.py
      - name: system_k1_panel (system TB, about 9 native frames)
        run: python -B fpga/sim/run_sim.py system_k1_panel
      - name: Panel captures against the model
        run: python -B scripts/k1/check_frames.py build/sim/system_k1_panel --expect 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k1-panel
          path: |
            build/sim/system_k1_panel/
            !build/sim/**/cartridge.hex
            !build/sim/**/monitor.hex
            !build/sim/**/font.hex
            !**/*.vvp
          retention-days: 7
          if-no-files-found: ignore

  core-machine:
    name: Core machine TB subset
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-iverilog
      - name: g, stall, stall_realign, stall_frac on pocket_memory
        run: python -B fpga/sim/run_core_machine.py --jobs 4
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-machine
          path: |
            cores/karabas-go-core-rk86/build/sim/machine/
            !**/cartridge.hex
            !**/monitor.hex
            !**/font.hex
            !**/*.vvp
          retention-days: 7
          if-no-files-found: ignore
